experiment:
  dataset: mfeat
  device: auto
  name: semi_mlp_Z10_L2_random
  seed: 42
kernels:
  num_mixtures: 4
  rff_samples: 1000
  type: ng_sm
latent_space:
  ecc_type: random_gaussian
  info_dim: 10
  redundancy_factor: 2
model:
  encoder_type: mlp
  inference_mode: semi_amortized
training:
  alignment_beta: 0.1
  batch_size: 128
  epochs: 500
  log_interval: 50
  lr: 0.01
  use_gp_loss: true
views:
  fac:
    input_dim: 216
    likelihood: gaussian
  fou:
    input_dim: 76
    likelihood: gaussian
  kar:
    input_dim: 64
    likelihood: gaussian
  mor:
    input_dim: 6
    likelihood: gaussian
  pix:
    input_dim: 240
    likelihood: gaussian
  zer:
    input_dim: 47
    likelihood: gaussian
