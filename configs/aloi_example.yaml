experiment:
  dataset: aloi
  device: auto
  name: aloi_z32_cnn2d_semi_base
  seed: 42

kernels:
  num_mixtures: 4
  rff_samples: 1000
  type: ng_sm

latent_space:
  ecc_type: none
  info_dim: 32
  redundancy_factor: 1

model:
  encoder_type: cnn2d
  inference_mode: semi_amortized

training:
  alignment_beta: 0.01
  batch_size: 64  # Smaller due to image memory
  epochs: 300
  log_interval: 10
  lr: 0.001  # Lower LR for image models
  use_amp: True
  use_gp_loss: True

views:
  light_dir1: {input_dim: 82944, likelihood: gaussian}  # 3*144*192
  light_dir2: {input_dim: 82944, likelihood: gaussian}
  light_dir3: {input_dim: 82944, likelihood: gaussian}
  light_dir4: {input_dim: 82944, likelihood: gaussian}

views_shapes:
  light_dir1: [3, 144, 192]
  light_dir2: [3, 144, 192]
  light_dir3: [3, 144, 192]
  light_dir4: [3, 144, 192]

# Dataset-specific kwargs
dataset_kwargs:
  mode: illumination
  reduce_objects: 100  # Use 100 objects for quick testing
