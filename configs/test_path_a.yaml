# Debug Path A: Random Gaussian
experiment:
  name: "debug_path_a"
  device: "auto"
  seed: 42

latent_space:
  info_dim: 10
  redundancy_factor: 2
  ecc_type: "random_gaussian" # Path A

model:
  inference_mode: "direct"

kernels:
  type: "ng_sm"
  num_mixtures: 2
  rff_samples: 50

views:
  fac: { input_dim: 216, likelihood: "gaussian" }
  fou: { input_dim: 76,  likelihood: "gaussian" }
  kar: { input_dim: 64,  likelihood: "gaussian" }
  pix: { input_dim: 240, likelihood: "gaussian" }
  zer: { input_dim: 47,  likelihood: "gaussian" }
  mor: { input_dim: 6,   likelihood: "gaussian" }

training:
  batch_size: 64
  lr: 0.01
  epochs: 1 # FAST
  log_interval: 1
