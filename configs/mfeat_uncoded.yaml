# 对照组实验配置 (Uncoded Baseline)
experiment:
  name: "cng_mvlvm_mfeat_uncoded" # 修改实验名
  device: "auto"
  seed: 42

# 潜空间配置
latent_space:
  info_dim: 10          
  redundancy_factor: 1   # 实际上不起作用，因为 ecc_type=none
  ecc_type: "none"       # 关键修改: 关闭 ECC

kernels:
  type: "ng_sm"
  num_mixtures: 4       
  rff_samples: 500      

views:
  fac: { input_dim: 216, likelihood: "gaussian" }
  fou: { input_dim: 76,  likelihood: "gaussian" }
  kar: { input_dim: 64,  likelihood: "gaussian" }
  pix: { input_dim: 240, likelihood: "gaussian" }
  zer: { input_dim: 47,  likelihood: "gaussian" }
  mor: { input_dim: 6,   likelihood: "gaussian" }

training:
  batch_size: 256
  lr: 0.01
  epochs: 500
  log_interval: 10
