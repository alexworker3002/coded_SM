experiment:
  dataset: 100leaves
  device: auto
  name: leaves_z16_direct
  seed: 42
kernels:
  num_mixtures: 4
  rff_samples: 1000
  type: ng_sm
latent_space:
  ecc_type: none
  info_dim: 16
  redundancy_factor: 1
model:
  encoder_type: mlp
  inference_mode: direct
training:
  alignment_beta: 0.01
  batch_size: 512
  epochs: 500
  log_interval: 10
  lr: 0.01
  use_amp: false
  use_gp_loss: true
views:
  shape:
    input_dim: 64
    likelihood: gaussian
  texture:
    input_dim: 64
    likelihood: gaussian
  margin:
    input_dim: 64
    likelihood: gaussian
