# 100Leaves Configuration (Strict Compatibility Mode)
experiment:
  name: "cng_mvlvm_100leaves_default"
  device: "auto"
  seed: 42

# Latent Space (High-Cardinality Adjustment)
latent_space:
  info_dim: 20
  redundancy_factor: 2
  ecc_type: "repetition"

# Kernels
kernels:
  type: "ng_sm"
  num_mixtures: 4
  rff_samples: 500

# Views (100Leaves Specific)
views:
  shape:   { input_dim: 64, likelihood: "gaussian" }
  texture: { input_dim: 64, likelihood: "gaussian" }
  margin:  { input_dim: 64, likelihood: "gaussian" }

# Training
training:
  batch_size: 128
  lr: 0.01
  epochs: 500
  log_interval: 10
