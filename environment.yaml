name: cng_mvlvm
channels:
  - pytorch-nightly
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy>=1.26
  - scipy>=1.12
  - pyyaml
  - tqdm
  - matplotlib
  - seaborn
  - tensorboard
  - ipykernel
  - pip
  - pip:
    # 使用 nightly 是为了最好的 MPS 支持，如果求稳可以改回稳定版
    - --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cpu
    - gpytorch
    - linear_operator
